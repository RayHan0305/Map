<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 230" fill="none" role="img" aria-labelledby="mascot-title">
  <title id="mascot-title">三位卡通飞行伙伴掠过星空</title>
  <style>
    .wingmate, .eyes, .glimmer { transform-box: fill-box; transform-origin: center; }
    .wingmate--green { animation: flutter-green 6.2s ease-in-out infinite; }
    .wingmate--blue { animation: flutter-blue 5.6s ease-in-out infinite; }
    .wingmate--pink { animation: flutter-pink 6.8s ease-in-out infinite; }
    .eyes { animation: blink 6s linear infinite; }
    .eyes--green { animation-delay: .7s; }
    .eyes--blue { animation-delay: 1.8s; }
    .comet { stroke-dasharray: .055 .945; animation: pulse-trail 4.1s linear infinite; }
    .comet--blue { animation-delay: -1.9s; }
    .comet--pink { animation-delay: -3s; }
    .glimmer { animation: glimmer 3.9s ease-in-out infinite; }
    .glimmer--late { animation-delay: -1.8s; }
    @keyframes flutter-green {
      0%, 100% { transform: translate(-3px, 2px) rotate(-2deg); }
      46% { transform: translate(8px, -7px) rotate(5deg); }
      77% { transform: translate(2px, 1px) rotate(1deg); }
    }
    @keyframes flutter-blue {
      0%, 100% { transform: translate(2px, 2px) rotate(1deg); }
      37% { transform: translate(8px, -7px) rotate(-3deg); }
      71% { transform: translate(-6px, -3px) rotate(2deg); }
    }
    @keyframes flutter-pink {
      0%, 100% { transform: translate(0, 3px) rotate(1deg); }
      38% { transform: translate(5px, -6px) rotate(-3deg); }
      72% { transform: translate(-5px, -1px) rotate(2deg); }
    }
    @keyframes blink {
      0%, 47%, 51%, 100% { transform: scaleY(1); }
      49% { transform: scaleY(.06); }
    }
    @keyframes pulse-trail {
      0% { stroke-dashoffset: 1; opacity: 0; }
      15%, 81% { opacity: .8; }
      100% { stroke-dashoffset: .06; opacity: 0; }
    }
    @keyframes glimmer {
      0%, 100% { opacity: .55; transform: scale(.82); }
      52% { opacity: 1; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wingmate, .eyes, .comet, .glimmer { animation: none; }
      .comet { display: none; }
    }
  </style>

